# Reference pipeline: build a container image, lint, scan it, write SBOMs, sign it and
# attest it, then push to Google Artifact Registry, authenticating to GCP with Workload
# Identity Federation. There is no service-account key and no repository secret.
#
# Copy to .github/workflows/secure-build.yml, then:
#   1. Set these repository variables (none is a secret): GCP_PROJECT_ID, AR_LOCATION,
#      AR_REPOSITORY, IMAGE_NAME, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT.
#      GCP_WIF_PROVIDER looks like projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER.
#   2. Create a GitHub environment named "release" with required reviewers and a deployment
#      branch and tag policy limited to main and v* tags.
#   3. Create the pool, provider and service account with the commands in
#      references/gcp-workload-identity.md. Its attribute condition names this repository.
#   4. Re-resolve every action SHA and tool digest before the first run (commands in
#      references/github-actions.md) and let Dependabot or Renovate keep them current.
#
# What runs where:
#   pull_request   hadolint, build to a tarball, scan the tarball, SBOMs. No cloud access.
#   push to main   the same, then push, scan the pushed digest, sign, attest, verify.
#   tag v*.*.*     as push to main.

name: secure-build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

# A superseded pull request run is cancelled. A push run is never cancelled: stopping a
# publish halfway leaves an image in the registry without its signature.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The workflow grants nothing. Each job asks for what it needs.
permissions: {}

env:
  IMAGE: ${{ vars.AR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/${{ vars.IMAGE_NAME }}
  # Tool images, pinned by digest. A tag can be repointed; a digest cannot.
  HADOLINT_IMAGE: ghcr.io/hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d # v2.15.1
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 # 0.76.0
  SYFT_IMAGE: ghcr.io/anchore/syft@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa # v1.54.1

jobs:
  workflow-audit:
    name: Audit workflows with zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      actions: read # zizmor reads workflow metadata for private repositories
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false # SARIF upload needs GitHub Advanced Security
          version: v1.31.1 # pin the tool; the action's default is the latest release

  pull-request-check:
    name: Build and scan without publishing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout; a pull request build never touches the cloud
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        run: docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold warning - < Dockerfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build to a tarball
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          provenance: false
          sbom: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - name: Scan the image
        # Fails on HIGH and CRITICAL findings. Add --ignore-unfixed only if the team has agreed
        # that an unfixed vulnerability does not block a build, and write that decision down.
        run: |
          docker run --rm -v "$RUNNER_TEMP:/work" "$TRIVY_IMAGE" image \
            --input /work/image.tar --scanners vuln,secret \
            --severity HIGH,CRITICAL --exit-code 1

      - name: Write SBOMs
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          docker run --rm -v "$RUNNER_TEMP:/work" "$SYFT_IMAGE" docker-archive:/work/image.tar \
            -o cyclonedx-json=/work/evidence/sbom.cdx.json -o spdx-json=/work/evidence/sbom.spdx.json

      - name: Keep the SBOMs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-pull-request
          path: ${{ runner.temp }}/evidence/
          retention-days: 14

  publish:
    name: Build, scan, sign and push
    if: github.event_name == 'push'
    needs: [workflow-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release # required reviewers and the branch and tag policy live on this environment
    permissions:
      contents: read # checkout
      id-token: write # OIDC token for Workload Identity Federation and for keyless signing
      attestations: write # actions/attest build provenance (that step runs only on public repositories or GitHub Enterprise Cloud)
      artifact-metadata: write # actions/attest storage record
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        run: docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold warning - < Dockerfile

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.AR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # BuildKit's own attestations are off so the image stays one manifest; the signed
          # SBOM and provenance below are attached by cosign and actions/attest instead.
          provenance: false
          sbom: false

      - name: Scan the pushed image
        # Scans the exact digest that was pushed. The step fails the job on HIGH or CRITICAL
        # findings, which stops signing: an unsigned image is refused by the deploy gate.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          docker run --rm -e DOCKER_CONFIG=/dockercfg -v "$HOME/.docker:/dockercfg:ro" \
            -v "$RUNNER_TEMP/evidence:/out" "$TRIVY_IMAGE" image \
            --scanners vuln,secret --format json --output /out/trivy.json "$IMAGE@$DIGEST"
          docker run --rm -v "$RUNNER_TEMP/evidence:/out" "$TRIVY_IMAGE" convert \
            --format table --severity HIGH,CRITICAL --exit-code 1 /out/trivy.json

      - name: Write SBOMs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm -e DOCKER_CONFIG=/dockercfg -v "$HOME/.docker:/dockercfg:ro" \
            -v "$RUNNER_TEMP/evidence:/out" "$SYFT_IMAGE" "$IMAGE@$DIGEST" \
            -o cyclonedx-json=/out/sbom.cdx.json -o spdx-json=/out/sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign and attest
        # Keyless: the signing certificate carries this workflow's identity, issued from the
        # job's OIDC token. The entry lands in Sigstore's public transparency log, repository
        # path included; see references/github-actions.md before using this on a private repo.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/evidence/sbom.cdx.json" "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/evidence/sbom.spdx.json" "$IMAGE@$DIGEST"

      - name: Verify the signature against this workflow's identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/secure-build.yml@${{ github.ref }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Attest build provenance
        # GitHub artifact attestations need a public repository or GitHub Enterprise Cloud.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Keep the evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 90

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
