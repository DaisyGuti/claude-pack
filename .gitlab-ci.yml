# The gates from the README's "Gates before a merge", run on every merge request and on the
# default branch. .github/workflows/ci.yml runs the same steps on GitHub; keep the two in step.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:
  # node:22-bookworm, pinned by digest.
  image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
  interruptible: true
  timeout: 20m
  variables:
    UV_PYTHON: "3.12"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-venv jq
    - python3 -m venv /opt/uv && /opt/uv/bin/pip install -q uv==0.12.23
    - export PATH="/opt/uv/bin:$PATH"
    # scripts/validate.py runs `claude plugin validate`, which needs no login.
    - npm install --global @anthropic-ai/claude-code@2.1.302
  script:
    - uv run python scripts/validate.py
    - uv run ruff check
    - uv run ruff format --check
    - git ls-files -z '*.sh' | xargs -0 uvx --from shellcheck-py==0.11.0.1 shellcheck -x
    - uv run pytest -q
